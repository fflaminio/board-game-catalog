<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Wall</title>
<meta name="description" content="A personal board game collection: filter by duration, players, effort and category, and open any game for details, rulebook and music.">
<meta name="theme-color" content="#EBDDBB">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/fredoka-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/nunito-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/app.js" type="module" defer></script>
</head>
<body>
<div id="app">
  <header class="m-head" id="mHead">
    <div class="brand"><span class="brand-name">BOARD GAME WALL</span><span class="led" aria-hidden="true"></span></div>
    <div class="m-row">
      <button type="button" class="keycap m-filters" id="openFilters" aria-haspopup="dialog" aria-controls="panel">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
        FILTERS
      </button>
      <div class="lcd m-count"><span class="m-count-label">GAMES</span><span class="m-count-num" data-count>0</span></div>
    </div>
    <div class="lcd m-summary" id="summary"></div>
  </header>

  <aside class="panel" id="panel" aria-label="Filters">
    <span class="wood wood-l" aria-hidden="true"></span><span class="wood wood-r" aria-hidden="true"></span>
    <span class="screw s1" aria-hidden="true"></span><span class="screw s2" aria-hidden="true"></span><span class="screw s3" aria-hidden="true"></span><span class="screw s4" aria-hidden="true"></span>
    <div class="panel-head">
      <div class="brand"><span class="brand-name" id="panelTitle"><span class="only-d">BOARD GAME WALL</span><span class="only-m">FILTERS</span></span><span class="led" aria-hidden="true"></span></div>
      <button type="button" class="keycap icon-btn sheet-close" id="closeFilters" aria-label="Close filters">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="found-row">
      <button type="button" class="keycap show-btn" id="showGames">SHOW GAMES</button>
      <div class="lcd found" aria-live="polite" aria-atomic="true"><span class="found-label">GAMES FOUND</span><span class="found-num" data-count>0</span></div>
    </div>
    <div class="knobs" id="knobs"></div>
    <label class="search">
      <span class="sr-only">Search by keyword</span>
      <input class="lcd lcd-input" id="search" type="text" placeholder="SEARCH …" autocomplete="off" spellcheck="false" enterkeyhint="search" maxlength="60">
    </label>
    <div class="ctrl-row">
      <div class="ctrl" id="favRow" hidden>
        <button type="button" class="fav-btn" id="favBtn" aria-pressed="false" aria-labelledby="favTitle">
          <span class="fav-cap"><span class="fav-led" aria-hidden="true"></span><svg class="heart" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 5 6.2 5c2 0 3.5 1.1 4.3 2.5h3C14.3 6.1 15.8 5 17.8 5 21 5 23.1 8.2 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg></span>
        </button>
        <div class="label" id="favTitle">FAVORITES</div>
      </div>
      <div class="ctrl ctrl-panic">
        <button type="button" class="panic-btn" id="panic" aria-label="PANIC: reset all filters"></button>
        <div class="label">PANIC</div>
      </div>
    </div>
  </aside>

  <main class="wall" id="wall" tabindex="-1">
    <div class="grid" id="grid" role="group" aria-label="Games"></div>
    <p class="empty" id="empty" hidden>No games match these filters.<br><span>Press PANIC to reset.</span></p>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>

<dialog class="pw" id="pwDialog" aria-labelledby="pwTitle" aria-describedby="pwHint">
  <form id="pwForm" novalidate>
    <div class="label pw-title" id="pwTitle">OWNER PASSWORD</div>
    <p class="hint" id="pwHint">Needed to change favorites and record plays.</p>
    <label><span class="sr-only">Password</span><input class="lcd lcd-input" id="pwInput" type="password" maxlength="16" autocomplete="current-password" required></label>
    <p class="pw-err" id="pwErr" role="alert"></p>
    <div class="pw-actions">
      <button type="button" class="keycap ghost" id="pwCancel">Cancel</button>
      <button type="submit" class="keycap" id="pwOk">Unlock</button>
    </div>
  </form>
</dialog>
<div class="toast lcd" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px;font-family:sans-serif">This catalog needs JavaScript to filter and show the games.</p></noscript>
</body>
</html>
